name: CI

on:
  push:
    branches: ["main", "stage-*/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned engines and tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and types
        run: |
          ruff format --check .
          ruff check .
          mypy
      - name: Generated files are current
        run: |
          python -m dstool schemas --check
          python -m dstool card --check
      - name: All records validate (schemas, hashes, lock, contamination, manifest)
        run: python -m dstool validate
      - name: Reproducible (rebuild with the pinned engines; byte-identical)
        run: python -m dstool build --check
      - name: Tests (contamination, protected splits, immutability, privacy, reproducibility)
        run: python -m pytest -q
      # The frozen cA 1.0 contract ships in the same pinned blux-ca commit; verify_fixtures runs it from a checkout.
      - uses: actions/checkout@v4
        with:
          repository: Outer-Void/blux-ca
          ref: 6dcfcd70964d76db0534371f175710c59fb5adbe
          path: _engine
      - name: Legacy v1.0 fixtures against the frozen cA 1.0 contract
        working-directory: legacy
        run: |
          python scripts/validate_dataset.py
          python scripts/verify_fixtures.py --engine-root "$GITHUB_WORKSPACE/_engine" --policy-pack cA-pro
          python scripts/verify_fixtures.py --engine-root "$GITHUB_WORKSPACE/_engine" --policy-pack cA-mini
          python scripts/verify_fixtures.py --engine-root "$GITHUB_WORKSPACE/_engine" --policy-pack cA-pro --profile cpu
